name: grocer_mate
description: "A Flutter grocery app with product discovery, cart management, offline support, and checkout revalidation."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.14.0


dependencies:
  flutter:
    sdk: flutter
  # --- UI & VISUAL COMPONENTS ---
  material_ui: ^1.11.1                      # Material Design UI components and utilities
  cupertino_ui: ^1.1.7                      # Cupertino-style UI components for iOS interfaces
  cupertino_icons: ^2.0.0                   # iOS-style icons for Cupertino widgets and Apple-like UI
  flutter_svg: ^2.5.0                       # Render and display SVG images and vector icons efficiently
  cached_network_image: ^4.0.7              # Efficient image loading with disk & memory caching from network
  flutter_spinkit: ^5.2.2                   # Pre-built animated loading indicators (spinners, waves, pulses)
  skeletonizer: ^3.0.0                      # Skeleton loading UI with shimmer effects while data is loading

  # --- STATE MANAGEMENT & UTILITIES ---
  flutter_bloc: ^9.1.1                      # BLoC/Cubit pattern for structured reactive state management
  equatable: ^2.1.0                         # Simplifies equality comparison in states and events
  dartz: ^0.10.1                            # Functional programming utilities (Either, Option, etc.)
  logger: ^2.8.0                            # Structured logging for debugging (supports levels & filters)

  # --- NETWORKING & API ---
  internet_connection_checker: ^3.0.1       # Checks live internet connectivity (beyond just Wi-Fi/mobile)

  # --- USER INTERACTION & UX ---
  fluttertoast: ^10.0.3                     # Displays quick toast messages for user feedback

  # --- SCREEN RESPONSIVENESS ---
  flutter_screenutil: ^5.9.3                # Makes UI responsive to any device’s screen dimensions

  # --- DEPENDENCY INJECTION & LOCAL STORAGE ---
  get_it: ^9.3.0                            # Service locator pattern for dependency injection
  shared_preferences: ^2.5.6                # Simple key–value local storage for app preferences
  flutter_secure_storage: ^11.2.0           # Encrypted local storage for sensitive data (tokens, etc.)

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/svgs/
    - assets/jsons/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700